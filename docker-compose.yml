# Local dev stack for the Medusa backend, per the PRD's Local Development spec.
#
# Postgres is intentionally NOT a service here: run `supabase start` (Supabase
# CLI) separately instead of a bare postgres image, so local dev matches the
# hosted project's Postgres version, extensions, and Supavisor pooler. The
# `medusa` service below reaches it via host.docker.internal, since Supabase
# CLI publishes its containers to the host, not this compose network.
#
# The Next.js storefront (apps/storefront) is not containerized locally or in
# production; only Medusa is deployed as a Docker image (to Render).

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  medusa:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file:
      - apps/backend/.env
    environment:
      # host.docker.internal resolves to both an A and AAAA record in this
      # setup, but the AAAA route isn't actually usable inside the container;
      # without this, Node hangs on the IPv6 attempt until it times out.
      NODE_OPTIONS: --dns-result-order=ipv4first --max-old-space-size=4096
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"
    volumes:
      - ./apps/backend:/app/apps/backend
      - backend-node-modules:/app/apps/backend/node_modules
      # pnpm's package store (not just node_modules) has to survive container
      # recreation too: `pnpm dev`/`exec` re-verifies the workspace against
      # the lockfile on every run, and without this it re-resolves ~1400
      # packages against the npm registry from scratch each time, which is
      # both slow and prone to OOMing the container.
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      - redis

volumes:
  redis-data:
  backend-node-modules:
  pnpm-store:
