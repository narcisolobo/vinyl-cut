name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@vc/backend lint
      - run: pnpm --filter=@vc/storefront lint
      # Neither lint config is type-aware (no parserOptions.project), so
      # this is the only thing that actually catches type errors on the
      # backend -- the storefront gets the same coverage for free from
      # `next build` (storefront-build below), which type-checks by
      # default.
      - run: pnpm --filter=@vc/backend exec tsc --noEmit

  storefront-unit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@vc/storefront test

  backend-unit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@vc/backend test:unit

  backend-integration:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      # @medusajs/test-utils creates and migrates a per-worker throwaway
      # database from these instead of DATABASE_URL -- see
      # medusa-test-runner.js's configLoaderOverride.
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
      JWT_SECRET: supersecret
      COOKIE_SECRET: supersecret
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:5173,http://localhost:9000
      AUTH_CORS: http://localhost:5173,http://localhost:9000
      # @medusajs/file-s3's constructor hard-throws when these are empty,
      # even though no spec here exercises file upload -- placeholders
      # only need to be non-empty, never actually called.
      S3_ACCESS_KEY_ID: placeholder
      S3_SECRET_ACCESS_KEY: placeholder
      S3_REGION: us-east-1
      S3_BUCKET: placeholder
      S3_ENDPOINT: http://localhost:9999
      S3_FILE_URL: http://localhost:9999/placeholder
      # Test-mode secret key -- checkout.spec.ts creates real payment
      # sessions against Stripe's test API. Add STRIPE_TEST_SECRET_KEY
      # as a repo/environment secret.
      STRIPE_API_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@vc/backend test:integration:http
      - run: pnpm --filter=@vc/backend test:integration:modules

  backend-build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@vc/backend build

  storefront-build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Both of these are read at module-eval time and hard-throw if
      # unset (src/lib/medusa/config.ts, src/lib/stripe/config.ts) --
      # `next build` server-renders client components during static
      # generation, so it needs real-looking values even with no
      # backend or Stripe account reachable in CI.
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: placeholder
      NEXT_PUBLIC_STRIPE_KEY: pk_test_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@vc/storefront build
